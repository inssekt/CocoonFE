builds:
  ra64: { app: com.retroarch.aarch64, name: RetroArch (64 bits) }
  ra32: { app: com.retroarch.ra32, name: RetroArch (32 bits) }
  ra: { app: com.retroarch, name: RetroArch }
activity: com.retroarch.browser.retroactivity.RetroActivityFuture

launches:
  standard:
    extras:
      ROM: "{file.path}"
      LIBRETRO: /data/data/{app}/cores/{core}_libretro_android.so
      CONFIGFILE: /storage/emulated/0/Android/data/{app}/files/retroarch.cfg
      IME: com.android.inputmethod.latin/.LatinIME
      DATADIR: /data/data/{app}
      APK: /data/app/{app}-1/base.apk
      SDCARD: /storage/emulated/0
      EXTERNAL: /storage/emulated/0/Android/data/{app}/files
    flags: [clear-task, clear-top]
  basic:
    extras:
      ROM: "{file.path}"
      LIBRETRO: /data/data/{app}/cores/{core}_libretro_android.so
      CONFIGFILE: /storage/emulated/0/Android/data/{app}/files/retroarch.cfg
    flags: [clear-task, clear-top]

